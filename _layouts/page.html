---
layout: default
---

{% if page.banner_image %}
<section class="banner">
	<div class="banner-image" style="background-image: url({{ page.banner_image | relative_url }});"	>
	</div>
</section>
{% endif %}
<section class="intro">

	<div class="wrap">

		<h1>{{ page.title }}</h1>
		<p>{{ page.subtitle }}</p>

	</div>

</section>

<section class="single{% if page.content_class %} {{ page.content_class }}{% endif %}">

	<div class="wrap">

		{{ page.content }}

	</div>

</section>
